# /etc/nginx/sites-available/skynetwork
# HTTPS is added by certbot: sudo certbot --nginx -d example.com
server {
    listen 80;
    server_name example.com;

    client_max_body_size 8m;  # banners for events and news: up to 5 MB

    # The Discord bot (github.com/Anntixs/skynetwork_bot): SkyNetwork Connect sends members back to
    # /discord/callback after they sign in. Remove this block if the bot is not installed.
    location /discord/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
